app = "nifty-signal-engine"
primary_region = "sin"              # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT       = "8080"
  TZ         = "Asia/Kolkata"
  RECIPIENT_EMAIL = "rishankaggarwal1994@gmail.com"
  CAPITAL    = "1000000"
  RISK_PCT   = "0.015"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = false         # keep always-on (no cold starts)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    protocol     = "http"
    timeout      = "10s"
